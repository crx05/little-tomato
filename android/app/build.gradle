apply plugin: 'com.android.application'

def signingValues = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
def hasReleaseKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { signingValues[it] }

android {
    namespace 'com.littletomato.focus'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.littletomato.focus'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name in ['assembleRelease', 'bundleRelease'] } && !hasReleaseKey) {
        throw new GradleException('正式 APK 需要固定签名。请按 ANDROID.md 创建 android/keystore.properties。')
    }
}

dependencies {
    implementation project(':capacitor-android')
    if (findProject(':capacitor-cordova-android-plugins') != null) implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// Generated by cap sync; the app's reminder plugin is registered in MainActivity.
if (file('capacitor.build.gradle').exists()) apply from: 'capacitor.build.gradle'
